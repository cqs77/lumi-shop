<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>光采汇 · 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0d12;--panel:#161a24;--panel2:#1c2130;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--gold:#d9b26a;--gold2:#f0d49a;--teal:#4dc9be;--text:#eef1f6;--muted:#9aa3b5;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Spectral',Georgia,serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font-family:inherit}input,textarea,select{font-family:inherit}
.nav{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(18px,5vw,60px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:rgba(11,13,18,.92)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.1em;font-size:19px;color:var(--gold)}
.brand-mark{width:28px;height:28px;color:var(--gold);flex:none}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{font-size:15px;color:var(--muted)}.nav-links a:hover{color:var(--gold)}
.nav-admin{border:1px solid var(--line2);padding:7px 16px;border-radius:100px;color:var(--gold)!important}
.hero{padding:clamp(60px,10vw,120px) clamp(18px,5vw,60px);text-align:center;background:radial-gradient(900px 400px at 50% -20%,rgba(217,178,106,.13),transparent 65%),linear-gradient(180deg,#0b0d12,#11141c)}
.hero h1{font-weight:700;font-size:clamp(30px,5.2vw,58px);background:linear-gradient(120deg,#fff 15%,var(--gold2) 60%,var(--gold) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px}
.hero p{color:var(--muted);max-width:600px;margin:0 auto;font-weight:300}
.section{padding:clamp(50px,8vw,100px) clamp(18px,5vw,60px);max-width:1280px;margin:0 auto}
.section-head{margin-bottom:44px}
.section-head h2{font-weight:600;font-size:clamp(24px,3.6vw,40px);color:#fff;margin-bottom:12px}
.section-sub{color:var(--muted);max-width:600px;font-weight:300}
.cat-tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;justify-content:center}
.cat-tab{padding:12px 32px;border-radius:100px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--muted);cursor:pointer;font-size:15px;letter-spacing:.1em;transition:.22s}
.cat-tab:hover{border-color:var(--gold);color:var(--gold2)}
.cat-tab.active{background:linear-gradient(120deg,var(--gold),var(--gold2));border-color:transparent;color:#1a1408;font-weight:600}
.cat-count{font-size:12px;opacity:.7;margin-left:5px}
.cat-title{font-size:clamp(22px,3vw,32px);color:var(--gold2);margin-bottom:8px}
.cat-sub{color:var(--muted);font-size:14.5px;margin-bottom:28px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px}
.loading{color:var(--muted)}
.card{background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.3s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-6px);border-color:var(--line2)}
.card-badge{position:absolute;top:14px;left:14px;z-index:2;padding:5px 14px;border-radius:100px;font-size:11px;letter-spacing:.12em;font-weight:600}
.card-badge.common{background:rgba(160,170,190,.9);color:#11151f}
.card-badge.race{background:rgba(77,201,190,.9);color:#06231f}
.card-badge.epic{background:rgba(217,178,106,.92);color:#241a05}
.card-img{aspect-ratio:4/3;background:#0d1119;overflow:hidden}.card-img img{width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .card-img img{transform:scale(1.05)}
.card-body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-body h3{font-size:20px;font-weight:600;color:#fff}
.card-body p{font-size:14.5px;color:var(--muted);flex:1}
.price{font-size:26px;color:var(--gold2);font-weight:600}
.card-actions{display:flex;gap:10px;margin-top:8px}
.btn{font-size:13.5px;letter-spacing:.08em;padding:13px 26px;border-radius:100px;cursor:pointer;border:1px solid transparent;transition:.22s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#1a1408;font-weight:600}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{border-color:var(--line2);color:var(--gold)}.btn-ghost:hover{background:rgba(217,178,106,.08)}
.btn-block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.footer{border-top:1px solid var(--line);padding:44px;background:#090b10;text-align:center}
.footer p{color:var(--muted);font-size:13.5px;margin-top:10px}
.cart-fab{position:fixed;right:24px;bottom:24px;z-index:45;width:58px;height:58px;border-radius:50%;border:1px solid var(--line2);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 32px -12px rgba(217,178,106,.8)}
.cart-fab span{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;background:#0b0d12;color:var(--gold2);border:1px solid var(--gold);border-radius:100px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.drawer-mask{position:fixed;inset:0;background:rgba(5,6,10,.72);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.drawer-mask.open{opacity:1;pointer-events:auto}
.cart-drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);z-index:50;background:linear-gradient(180deg,#141824,#0d1018);border-left:1px solid var(--line);transform:translateX(100%);transition:.35s;display:flex;flex-direction:column}
.cart-drawer.open{transform:translateX(0)}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:22px;border-bottom:1px solid var(--line)}
.cart-head h3{font-size:19px;color:var(--gold)}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:flex}
.cart-items{flex:1;overflow-y:auto;padding:16px 22px}
.cart-empty{color:var(--muted);font-size:14px;text-align:center;padding:60px 0}
.cart-row{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.cart-row img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.cart-row .info{flex:1}.cart-row .info h4{font-size:15px;font-weight:500;color:#fff}
.cart-row .info span{font-size:13px;color:var(--gold2)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:none;color:var(--gold);cursor:pointer;font-size:15px}
.qty span{min-width:18px;text-align:center;font-size:14px}
.cart-foot{padding:20px 22px;border-top:1px solid var(--line);background:rgba(0,0,0,.28)}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.cart-total span{color:var(--muted);font-size:14px}.cart-total strong{font-size:26px;color:var(--gold2)}
.modal-mask{position:fixed;inset:0;background:rgba(5,6,10,.82);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
.modal-mask.open{opacity:1;pointer-events:auto}
.modal{background:linear-gradient(170deg,#1a1f2e,#11151f);border:1px solid var(--line2);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:19px;color:var(--gold)}
.modal-body{padding:24px}
.field{margin-bottom:15px;display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}.field label .req{color:#ff8a8a}
.field input,.field textarea,.field select{background:rgba(0,0,0,.34);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;color:var(--text);font-size:15px;outline:none;width:100%}
.field textarea{min-height:70px;resize:vertical}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form-grid2{grid-template-columns:1fr}}
.order-summary{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.sum-line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--muted)}
.sum-line strong{color:#fff}
.sum-line.total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.sum-line.total strong{font-size:21px;color:var(--gold2)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.ok-box{text-align:center;padding:20px 0}
.ok-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:rgba(77,201,190,.14);display:flex;align-items:center;justify-content:center;color:var(--teal)}
.ok-box h3{font-size:22px;color:#fff;margin-bottom:10px}
.ok-box p{color:var(--muted);font-size:14.5px}
.order-no{display:inline-block;margin-top:12px;padding:8px 18px;background:rgba(217,178,106,.12);border:1px dashed var(--gold);border-radius:10px;color:var(--gold2);font-family:monospace}
.detail-img{width:100%;border-radius:14px;margin-bottom:18px}
.detail-desc{color:var(--muted);font-size:14.5px;margin-bottom:14px}
.detail-detail{color:var(--text);font-size:15px;line-height:1.8}
.detail-price{font-size:30px;color:var(--gold2);margin:16px 0}
.detail-cat{display:inline-block;padding:4px 14px;border-radius:100px;font-size:12px;letter-spacing:.1em;margin-bottom:10px}
.detail-cat.common{background:rgba(160,170,190,.18);color:#b9c2d0}
.detail-cat.race{background:rgba(77,201,190,.18);color:var(--teal)}
.detail-cat.epic{background:rgba(217,178,106,.18);color:var(--gold2)}
.admin-wrap{max-width:1180px;margin:0 auto;padding:34px clamp(16px,4vw,40px) 90px}
.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.admin-head h1{font-size:28px;color:var(--gold)}
.login-card{max-width:400px;margin:14vh auto 0;padding:34px;border:1px solid var(--line2);border-radius:20px;background:linear-gradient(165deg,#161a24,#11151f)}
.login-card h2{font-size:22px;color:var(--gold);margin-bottom:8px}
.login-card p{color:var(--muted);font-size:14px;margin-bottom:22px}
.admin-msg{font-size:13px;margin-top:10px;color:var(--teal)}.admin-msg.err{color:#ff8a8a}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 22px;border-radius:100px;border:1px solid var(--line2);background:none;color:var(--muted);cursor:pointer;font-size:14px}
.tab.active{background:rgba(217,178,106,.13);border-color:var(--gold);color:var(--gold)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:linear-gradient(165deg,var(--panel),#11151f);border:1px solid var(--line);border-radius:14px;padding:20px}
.stat-card .label{font-size:13px;color:var(--muted);margin-bottom:8px}
.stat-card .value{font-size:28px;color:var(--gold2);font-weight:600}
.section-mini{border:1px solid var(--line2);border-radius:16px;padding:22px;background:linear-gradient(165deg,var(--panel),#11151f);margin-bottom:26px}
.section-mini h3{font-size:18px;color:var(--gold);margin-bottom:16px}
.upload-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line2)}
.admin-list{display:grid;gap:14px}
.admin-row{display:flex;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(22,26,36,.6)}
.admin-row img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.admin-row .meta{flex:1;min-width:0}
.admin-row .meta h4{font-size:16px;color:#fff;font-weight:500;display:flex;align-items:center;gap:8px}
.admin-row .meta span{font-size:13px;color:var(--gold2)}
.admin-row .meta p{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:2px 10px;border-radius:100px;font-size:10.5px;font-weight:600}
.tag.common{background:rgba(160,170,190,.18);color:#b9c2d0}
.tag.race{background:rgba(77,201,190,.18);color:var(--teal)}
.tag.epic{background:rgba(217,178,106,.18);color:var(--gold2)}
.tag.none{background:rgba(255,255,255,.08);color:var(--muted)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.row-actions button{font-size:12px;padding:8px 13px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:none;color:var(--gold);white-space:nowrap}
.row-actions .danger{color:#ff8a8a;border-color:rgba(255,120,120,.3)}
.order-card{border:1px solid var(--line);border-radius:14px;background:rgba(22,26,36,.6);padding:18px;margin-bottom:14px}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.order-no-t{font-family:monospace;font-size:14px;color:var(--gold2)}
.order-time{font-size:12.5px;color:var(--muted)}
.badge{padding:4px 12px;border-radius:100px;font-size:12px;font-weight:600}
.badge.pending{background:rgba(255,193,7,.16);color:#ffc107}
.badge.shipped{background:rgba(77,201,190,.16);color:var(--teal)}
.badge.done{background:rgba(120,220,120,.16);color:#7cdc7c}
.badge.cancelled{background:rgba(255,120,120,.16);color:#ff8a8a}
.order-body{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.order-body{grid-template-columns:1fr}}
.order-block h5{font-size:12.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
.order-block .kv{font-size:14px;color:var(--text);line-height:1.7}
.order-block .kv b{color:#fff;font-weight:500}
.order-items{font-size:14px;color:var(--text);line-height:1.8}
.order-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.order-actions select{padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--text);font-size:13px}
.empty-tip{color:var(--muted);text-align:center;padding:50px 0;font-size:14px}
@media(max-width:720px){.nav-links a:not(.nav-admin){display:none}}

</style></head><body>
<div id="login-view"><div class="login-card"><h2>后台管理登录</h2><p>请输入管理密码以进入后台系统。</p><div class="field"><label>管理密码</label><input type="password" id="pw" placeholder="••••••••"></div><button class="btn btn-primary btn-block" id="login-btn">进入后台</button><div class="admin-msg" id="login-msg"></div><p style="margin-top:20px;font-size:12.5px;color:var(--muted)">返回 <a href="./" style="color:var(--gold)">商城首页</a></p></div></div>
<div id="panel-view" style="display:none"><div class="admin-wrap"><div class="admin-head"><div><h1>后台管理系统</h1><p style="color:var(--muted);font-size:14px">商品管理（COMMON/RACE/EPIC）· 订单与收货信息管理 · 数据统计</p></div><div style="display:flex;gap:10px"><a class="btn btn-ghost" href="./" target="_blank">查看商城</a><button class="btn btn-ghost" id="logout-btn">退出</button></div></div>
<div class="tabs"><button class="tab active" data-tab="products">商品管理</button><button class="tab" data-tab="orders">订单管理</button><button class="tab" data-tab="stats">数据统计</button></div>
<div id="tab-products"><div class="section-mini"><h3 id="form-title">上传新商品</h3><input type="hidden" id="edit-id"><div class="form-grid2"><div class="field"><label>商品名称 *</label><input id="f-name" placeholder="例如：川崖泉"></div><div class="field"><label>价格（美元）*</label><input type="number" id="f-price" step="0.01" placeholder="5.00"></div></div><div class="form-grid2"><div class="field"><label>商品分类 *</label><select id="f-category"></select></div><div class="field"><label>&nbsp;</label><div style="font-size:12.5px;color:var(--muted);padding-top:12px">选择 COMMON(0)/RACE(1)/EPIC(2)</div></div></div><div class="field"><label>简短描述</label><input id="f-desc" placeholder="一句话卖点"></div><div class="field"><label>详细图文介绍</label><textarea id="f-detail" placeholder="完整的商品介绍…"></textarea></div><div class="field"><label>商品图片</label><div class="upload-row"><input type="file" id="f-file" accept="image/*"><span style="font-size:12.5px;color:var(--muted)">或填写图片地址 ↓</span></div><input id="f-image" placeholder="/static/img/p1.jpg 或 https://…" style="margin-top:10px"><img id="f-preview" class="preview-thumb" src="" alt="" style="display:none;margin-top:10px"></div><div style="display:flex;gap:12px;margin-top:6px"><button class="btn btn-primary" id="save-btn">保存商品</button><button class="btn btn-ghost" id="cancel-btn" style="display:none">取消编辑</button></div><div class="admin-msg" id="form-msg"></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px"><h3 style="color:var(--gold);font-size:18px">商品列表</h3><select id="filter-category" style="padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--text);font-size:13px"></select></div>
<div class="admin-list" id="product-list"></div></div>
<div id="tab-orders" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px"><h3 style="color:var(--gold);font-size:18px">订单与收货信息</h3><a class="btn btn-ghost" id="export-btn" style="font-size:13px;padding:10px 20px">导出 CSV</a></div><div id="order-list"></div></div>
<div id="tab-stats" style="display:none"><div class="stats-grid" id="stats-grid"></div><div class="section-mini"><h3>按国家/地区 与 商品分类</h3><div id="stats-country" style="font-size:14px;line-height:2;color:var(--text)"></div></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);const API='';
let PW=sessionStorage.getItem('shop_pw')||'';let products=[];let orders=[];let cats=[];
const STATUS_CN={pending:'待处理',shipped:'已发货',done:'已完成',cancelled:'已取消'};
const fmtUsd=n=>'$'+Number(n||0).toFixed(2);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opts={}){const o=Object.assign({},opts);o.headers=Object.assign({'Content-Type':'application/json','X-Admin-Password':PW},opts.headers||{});return fetch(path,o)}
function showLogin(){$('#login-view').style.display='block';$('#panel-view').style.display='none'}
async function showPanel(){$('#login-view').style.display='none';$('#panel-view').style.display='block';await loadCats();loadProducts()}
async function loadCats(){try{cats=await(await fetch('/api/categories')).json()}catch(e){cats=[]}
const sel=$('#f-category');if(sel)sel.innerHTML='<option value="">未分类</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name||c.id)}</option>`).join('');
const filt=$('#filter-category');if(filt)filt.innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option value="${c.id}">${esc(c.name||c.id)}</option>`).join('')}
$('#login-btn').addEventListener('click',async()=>{PW=$('#pw').value.trim();
if((await api('/api/products')).status===200){sessionStorage.setItem('shop_pw',PW);showPanel()}
else{$('#login-msg').textContent='密码错误，请重试。';$('#login-msg').className='admin-msg err'}});
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#login-btn').click()});
$('#logout-btn').addEventListener('click',()=>{sessionStorage.removeItem('shop_pw');PW='';showLogin()});
$$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
['products','orders','stats'].forEach(n=>{$('#tab-'+n).style.display=(n===t.dataset.tab)?'block':'none'});
if(t.dataset.tab==='orders')loadOrders();if(t.dataset.tab==='stats')loadStats()}));
$('#f-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
const fd=new FormData();fd.append('file',f);
const r=await fetch('/api/upload',{method:'POST',headers:{'X-Admin-Password':PW},body:fd});const d=await r.json();
if(d.ok){$('#f-image').value=d.url;setPreview(d.url);msg('图片上传成功')}else msg('上传失败：'+(d.error||'未知错误'),true)});
$('#f-image').addEventListener('input',e=>setPreview(e.target.value));
function setPreview(url){const img=$('#f-preview');if(url){img.src=url;img.style.display='block'}else img.style.display='none'}
$('#save-btn').addEventListener('click',async()=>{const id=$('#edit-id').value;
const body={name:$('#f-name').value.trim(),price_usd:parseFloat($('#f-price').value||0),category:$('#f-category').value,desc:$('#f-desc').value.trim(),detail:$('#f-detail').value.trim(),image:$('#f-image').value.trim()||'/static/img/p1.jpg'};
if(!body.name){msg('请填写商品名称',true);return}if(!(body.price_usd>0)){msg('请填写有效的美元价格',true);return}
const r=id?await api('/api/products/'+id,{method:'PUT',body:JSON.stringify(body)}):await api('/api/products',{method:'POST',body:JSON.stringify(body)});
if(r.ok){msg(id?'已更新商品':'已上传新商品');resetForm();loadProducts()}else{const d=await r.json().catch(()=>({}));msg('保存失败：'+(d.error||r.status),true)}});
$('#cancel-btn').addEventListener('click',resetForm);
function resetForm(){$('#edit-id').value='';$('#f-name').value='';$('#f-price').value='';$('#f-category').value='';$('#f-desc').value='';$('#f-detail').value='';$('#f-image').value='';$('#f-file').value='';setPreview('');$('#form-title').textContent='上传新商品';$('#cancel-btn').style.display='none'}
function msg(t,isErr){const m=$('#form-msg');m.textContent=t;m.className='admin-msg'+(isErr?' err':'');setTimeout(()=>{m.textContent=''},3000)}
function catTag(id){if(!id)return '<span class="tag none">未分类</span>';const c=cats.find(x=>x.id===id);return `<span class="tag ${id}">${esc(c?c.name:id)}</span>`}
async function loadProducts(){products=await(await api('/api/products')).json();
const fc=$('#filter-category').value;const list=fc?products.filter(p=>(p.category||'')===fc):products;const w=$('#product-list');
if(!list.length){w.innerHTML='<p class="empty-tip">还没有商品。</p>';return}
w.innerHTML=list.map(p=>`<div class="admin-row"><img src="${p.image||'/static/img/p1.jpg'}" alt=""><div class="meta"><h4>${esc(p.name)} ${catTag(p.category)}</h4><span>${fmtUsd(p.price_usd)}</span><p>${esc(p.desc||'')}</p></div><div class="row-actions"><button data-edit="${p.id}">编辑</button><button class="danger" data-del="${p.id}">删除</button></div></div>`).join('');
w.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editProduct(b.dataset.edit)));
w.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delProduct(b.dataset.del)))}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='filter-category')loadProducts()});
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;
$('#edit-id').value=p.id;$('#f-name').value=p.name;$('#f-price').value=p.price_usd;$('#f-category').value=p.category||'';$('#f-desc').value=p.desc||'';$('#f-detail').value=p.detail||'';$('#f-image').value=p.image||'';setPreview(p.image);
$('#form-title').textContent='编辑商品：'+p.name;$('#cancel-btn').style.display='inline-flex';window.scrollTo({top:0,behavior:'smooth'})}
async function delProduct(id){if(!confirm('确定要删除这个商品吗？'))return;
if((await api('/api/products/'+id,{method:'DELETE'})).ok){loadProducts();msg('已删除')}else msg('删除失败',true)}
async function loadOrders(){orders=await(await api('/api/orders')).json();const w=$('#order-list');
if(!orders.length){w.innerHTML='<p class="empty-tip">暂无订单。</p>';return}
w.innerHTML=orders.map(o=>{const s=o.shipping||{};const items=(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}（${fmtUsd(i.subtotal)}）`).join('<br>');
const opts=['pending','shipped','done','cancelled'].map(k=>`<option value="${k}" ${o.status===k?'selected':''}>${STATUS_CN[k]}</option>`).join('');
return `<div class="order-card"><div class="order-top"><div><span class="order-no-t">${esc(o.order_no)}</span><span class="order-time"> · ${esc(o.created_at)}</span></div><span class="badge ${o.status}">${STATUS_CN[o.status]||o.status}</span></div><div class="order-body"><div class="order-block"><h5>商品明细</h5><div class="order-items">${items}</div><div style="margin-top:8px;color:var(--gold2);font-weight:600">合计：${fmtUsd(o.total_usd)}</div></div><div class="order-block"><h5>收货信息</h5><div class="kv"><b>${esc(s.name||'')}</b><br>电话：${esc(s.phone||'')}<br>${s.email?'邮箱：'+esc(s.email)+'<br>':''}${esc(s.country||'')} ${esc(s.province||'')} ${esc(s.city||'')}<br>${esc(s.address||'')} ${esc(s.zipcode||'')}${s.note?'<br>备注：'+esc(s.note):''}</div></div></div><div class="order-actions"><select data-status="${o.order_no}">${opts}</select><button data-del-order="${o.order_no}">删除订单</button></div></div>`}).join('');
w.querySelectorAll('[data-status]').forEach(sel=>sel.addEventListener('change',async()=>{await api('/api/orders/'+sel.dataset.status,{method:'PUT',body:JSON.stringify({status:sel.value})});loadOrders()}));
w.querySelectorAll('[data-del-order]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('确定删除该订单？'))return;await api('/api/orders/'+b.dataset.delOrder,{method:'DELETE'});loadOrders()}))}
$('#export-btn').addEventListener('click',async()=>{const r=await api('/api/orders/export.csv');if(!r.ok){alert('导出失败');return}
const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='orders.csv';a.click();URL.revokeObjectURL(url)});
async function loadStats(){const d=await(await api('/api/stats')).json();
const catHtml=Object.entries(d.by_category||{}).map(([c,n])=>`${esc(c)}：${n} 个`).join(' · ')||'无';
$('#stats-grid').innerHTML=`<div class="stat-card"><div class="label">总订单数</div><div class="value">${d.total_orders}</div></div><div class="stat-card"><div class="label">商品总件数</div><div class="value">${d.total_qty}</div></div><div class="stat-card"><div class="label">订单总金额（美元）</div><div class="value">${fmtUsd(d.total_usd)}</div></div><div class="stat-card"><div class="label">待处理</div><div class="value">${d.by_status.pending||0}</div></div><div class="stat-card"><div class="label">已发货</div><div class="value">${d.by_status.shipped||0}</div></div><div class="stat-card"><div class="label">已完成</div><div class="value">${d.by_status.done||0}</div></div>`;
const cs=Object.entries(d.by_country||{}).sort((a,b)=>b[1]-a[1]);
$('#stats-country').innerHTML=(cs.length?cs.map(([c,n])=>`${esc(c)}：${n} 单`).join('<br>'):'<span style="color:var(--muted)">暂无数据</span>')+`<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><span style="color:var(--muted)">商品分类：</span>${catHtml}</div>`}
(async()=>{if(PW){if((await api('/api/products')).status===200){showPanel();return}PW='';sessionStorage.removeItem('shop_pw')}showLogin()})();

</script></body></html>
